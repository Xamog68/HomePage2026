  <script>
    /* Costruisce la piccola tabella storica dei ricevimenti del 2008/09. */
    function generaTabellaRicevimento() {
      const corpo = document.getElementById("tabella-ricevimento");
      if (!corpo || typeof Ricevimento === "undefined") return;

      const intestazione = document.createElement("tr");
      ["Numero", "Data", "Argomento sommario", "AVI", "PDF"].forEach(function (testo) {
        const cella = document.createElement("th");
        cella.textContent = testo;
        intestazione.appendChild(cella);
      });
      corpo.appendChild(intestazione);

      for (let i = 1; i < Ricevimento.length; i += 1) {
        if (!Ricevimento[i]) continue;
        const incontro = Ricevimento[i];
        const numeroFile = String(incontro[0]).padStart(2, "0");
        const riga = document.createElement("tr");

        [incontro[0], incontro[1], incontro[2]].forEach(function (testo) {
          const cella = document.createElement("td");
          cella.textContent = testo;
          riga.appendChild(cella);
        });

        const cellaAvi = document.createElement("td");
        if (incontro[3] === "m") {
          const linkMissing = document.createElement("a");
          linkMissing.href = "AD_Video.html#missing";
          linkMissing.textContent = "Missing!";
          cellaAvi.appendChild(linkMissing);
        } else {
          const linkAvi = document.createElement("a");
          linkAvi.href = PercorsoRicevimento + numeroFile + ".avi";
          linkAvi.target = "_blank";
          linkAvi.rel = "noopener";
          linkAvi.textContent = "avi";
          linkAvi.addEventListener("click", function () {
            registraDownload("avi", "ricevimento-" + numeroFile);
          });
          cellaAvi.appendChild(linkAvi);
        }
        riga.appendChild(cellaAvi);

        const cellaPdf = document.createElement("td");
        const linkPdf = document.createElement("a");
        linkPdf.href = PercorsoRicevimento + numeroFile + ".pdf";
        linkPdf.target = "_blank";
        linkPdf.rel = "noopener";
        linkPdf.textContent = "pdf";
        linkPdf.addEventListener("click", function () {
          registraDownload("pdf", "ricevimento-" + numeroFile);
        });
        cellaPdf.appendChild(linkPdf);
        riga.appendChild(cellaPdf);

        corpo.appendChild(riga);
      }
    }

    document.addEventListener("DOMContentLoaded", generaTabellaRicevimento);
  </script>
