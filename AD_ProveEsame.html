<H2 ALIGN="CENTER"><A NAME="Scritti"></A>Scritti d'esame</H2>

Questi scritti sono stati usati come seconda prova d'esame, secondo le 
seguenti modalit&agrave;.

<UL TYPE="SQUARE">
	<LI>
	
	<P>
	Si possono usare libri, appunti, calcolatrici (purch&eacute; non
	grafiche e non programmabili, e comunque del tutto inutili).
	</P>
	
	<LI>
	
	<P>
	Tutti i passaggi devono essere adeguatamente giustificati. Ogni
	esercizio viene valutato in base alla <EM>chiarezza</EM> ed alla
	<EM>correttezza</EM> delle spiegazioni fornite. La sola scrittura del
	risultato non ha alcun valore.
	</P>
	
	<LI>
	
	<P>
	Il tempo a disposizione &egrave; di 3 ore.
	</P>
	
</UL>
